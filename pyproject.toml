[project]
name = "api-tests"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0"
authors = [{ name = "Nikita" }]

dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "email-validator==2.3.0",
    "Faker==40.12.0",
    "dnspython==2.8.0",
    "curlify==3.0.0"
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
preview = true
select = [
    "UP",
    "I",
    "E",
    "W",
    "F",
    "B",
    "C4",
    "S",
    "BLE",
    "T20",
    "T10",
    "PT",
    "RUF",
    "DTZ",
    "ERA",
    "FURB",
]
ignore = [
    "C408",
    "RUF001",
    "RUF002",
    "RUF003",
    "S110",
]
exclude = [
    "src/tests/**",
]
fixable = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true