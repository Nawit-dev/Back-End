name: API Pipeline

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB_AUTH: auth
      POSTGRES_DB_UNIVERSITY: university
      AUTH_SERVICE_INTERNAL_URL: http://auth:8000
      AUTH_SERVICE_API_URL: http://auth:8000
      UNIVERSITY_SERVICE_INTERNAL_URL: http://university:8000
      UNIVERSITY_SERVICE_API_URL: http://university:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 15

      - name: Run tests
        run: docker compose run --rm auth pytest -v

      - name: Stop services
        run: docker compose down