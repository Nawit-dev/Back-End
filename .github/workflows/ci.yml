name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB_AUTH: auth
      POSTGRES_DB_UNIVERSITY: university

      AUTH_SERVICE_INTERNAL_URL: http://auth:8000
      AUTH_SERVICE_API_URL: http://auth:8000

      UNIVERSITY_SERVICE_INTERNAL_URL: http://university:8000
      UNIVERSITY_SERVICE_API_URL: http://university:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requirements.txt

      # 1. Ruff
      - name: Ruff check
        run: ruff check .

      # 2. Start docker services
      - name: Start services
        run: docker compose up -d

      # 3. Wait services
      - name: Wait for services
        run: |
          sleep 20
          docker ps

      # 4. Tests
      - name: Run tests with Allure
        run: pytest --alluredir=allure-results

      # 5. Install Allure
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/latest/download/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # 6. Generate report
      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      # 7. Deploy to GitHub Pages
      - name: Deploy report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report