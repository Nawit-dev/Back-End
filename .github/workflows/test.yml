name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB_AUTH: auth
      POSTGRES_DB_UNIVERSITY: university

      AUTH_SERVICE_INTERNAL_URL: http://auth:8000
      AUTH_SERVICE_API_URL: http://localhost:8000

      UNIVERSITY_SERVICE_INTERNAL_URL: http://university:8000
      UNIVERSITY_SERVICE_API_URL: http://localhost:8001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start services
        run: docker compose up -d

      - name: Run tests with Allure
        run: pytest --alluredir=allure-results
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results