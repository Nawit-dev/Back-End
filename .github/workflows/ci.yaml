name: API Pipeline

on:
  pull_request:
    branches: [main, review]
  push:
    branches: [main, review]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ENV для docker-compose
      - name: Create .env
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=1234" >> .env
          echo "POSTGRES_DB_AUTH=auth" >> .env
          echo "POSTGRES_DB_UNIVERSITY=university" >> .env
          echo "AUTH_SERVICE_INTERNAL_URL=http://auth:8000" >> .env
          echo "AUTH_SERVICE_API_URL=http://auth:8000" >> .env
          echo "UNIVERSITY_SERVICE_INTERNAL_URL=http://university:8000" >> .env
          echo "UNIVERSITY_SERVICE_API_URL=http://university:8000" >> .env

      # Python (линтер + pytest локально если надо)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff pytest allure-pytest

      # Линтинг
      - name: Ruff check
        run: ruff check .

      # Поднимаем сервисы
      - name: Start services
        run: docker compose up -d

      # Ждём готовности API
      - name: Wait for services
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8000/health && break
            sleep 2
          done
          for i in {1..30}; do
            curl -f http://localhost:8001/health && break
            sleep 2
          done

      # Запускаем тесты ВНУТРИ контейнера
      - name: Run tests
        run: docker compose exec -T tests pytest -v --alluredir=/app/allure-results

      # Генерация Allure отчёта
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history

      # Деплой (если PR в review)
      - name: Deploy to GitHub Pages
        if: github.event.pull_request.base.ref == 'review'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      # Очистка
      - name: Cleanup
        if: always()
        run: docker compose down